# Identifier ledger for the main specs in openspec/specs/.
# The rules are in openspec/config.yaml. `npm run spec-ids` (scripts/check-spec-ids.ts) enforces them.
# A prefix entry is permanent. `next` is the next free requirement number.
# Update this file in the commit that syncs or archives a change into the main specs.

# One entry for each capability in openspec/specs/: prefix -> { capability, next }.
prefixes:
  BMB:
    capability: backmatter-builders
    next: 5
  FAC:
    capability: document-facade
    next: 8
  PRS:
    capability: document-parsing
    next: 14
  ELV:
    capability: element-validation
    next: 5
  ERR:
    capability: error-model
    next: 14
  MDL:
    capability: model-derivation
    next: 22
  NAM:
    capability: naming-manifest
    next: 23
  VER:
    capability: schema-versioning
    next: 8
  SER:
    capability: serialization
    next: 6
  SRF:
    capability: binding-surface
    next: 8
  YML:
    capability: yaml-documents
    next: 12

# One entry for each retired identifier: id, reason and, for a relocation, replaced_by.
retired:
  - id: MDL-004
    reason: >-
      Deduplication from the per-document schemas and by equal structure alone left the contract. Type identity is a
      set of JSON pointers into the complete schema, and MDL-013 holds the deduplication rule.
    replaced_by: MDL-013
  - id: YML-011
    reason: >-
      PRS-010 holds the same resource-limit rule for each parse operation, including each YAML parse operation. Its
      scenario PRS-010.03 holds the alias-expansion case.
    replaced_by: PRS-010
  - id: FAC-001.02
    reason: >-
      The type of the facade argument is a matter of the language of each binding, so the contract has no rule for it.
  - id: FAC-004.01
    reason: >-
      The rule that this scenario tests moved to FAC-005.
